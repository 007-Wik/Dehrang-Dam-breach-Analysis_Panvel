name: dehrang-dam
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11

  # Core scientific
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib>=3.7
  - seaborn>=0.12
  - openpyxl>=3.1

  # Geospatial (conda-forge builds are pre-compiled — recommended)
  - geopandas>=0.14
  - rasterio>=1.3
  - rasterstats>=0.19
  - shapely>=2.0
  - fiona>=1.9
  - pyproj>=3.6
  - owslib>=0.29
  - cartopy>=0.22

  # Mapping
  - folium>=0.15
  - branca>=0.7

  # Jupyter
  - notebook>=7.0
  - ipywidgets>=8.0

  # pip-only packages
  - pip
  - pip:
      - pysheds>=0.3.5
      - earthengine-api>=0.1.390
      - geemap>=0.30
      - matplotlib-scalebar>=0.8
